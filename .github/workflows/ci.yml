name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
  pull_request_review:
    types: [submitted]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.filter.outputs.test }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            test:
              - 'QCut/**'
              - 'pyproject.toml'
              - 'tests/**'
              - '.github/workflows/**'
            docs:
              - 'QCut/**'
              - 'docs/**'

  test:
    runs-on: ${{ matrix.platform }}
    needs: changes
    if: ${{ needs.changes.outputs.test == 'true' }}
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest ]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: uv sync
     
      - name: Run tests
        run: |
          uv run python -m pytest --cov QCut --cov-report=term-missing --junitxml=test_report.xml --doctest-modules  --verbose --strict-markers tests
          uv pip install coveralls
          uv run coveralls
          
  test_docs:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv
        run: uv venv --python 3.11

      - name: Install dependencies
        run: uv pip install -r docs/requirements-docs.txt

      - name: Test if docs can be built
        run: cd docs && uv run sphinx-build -b html . build/sphinx/html -W

  lint:
    runs-on: ubuntu-latest
    name: Lint the project with ruff
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run ruff linter with pyproject.toml config
        run: uv run ruff check
  
  type-check:
    runs-on: ubuntu-latest
    name: Type check the project with ty
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11
      
      - name: Install dependencies
        run: uv sync
      
      - name: Run ty type checker
        run: uvx ty check QCut/    