<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1784 660" width="1784" height="660" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eaf2ff"/>
      <stop offset="100%" stop-color="#9dc4ff"/>
    </linearGradient>
    <linearGradient id="bladeB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#b8d3ff"/>
    </linearGradient>
  </defs>
  <rect width="1784" height="660" fill="#000000"/>

  <!-- wordmark -->
  <g transform="translate(-453 -954.35) scale(1.7)">
  <!-- ============ WORDMARK ============ -->
  <g stroke="#ffffff" stroke-width="18"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Q -->
    <circle cx="353" cy="762" r="54"/>
    <path d="M 398 806 L 430 840"/>
    <!-- C -->
    <path d="M 524 718 A 54 54 0 1 0 524 806"/>
    <!-- u -->
    <path d="M 629 738 L 629 812"/>
    <path d="M 573 738 L 573 784 A 28 28 0 0 0 629 784"/>
    <!-- t -->
    <path d="M 682 698 L 682 786 A 26 26 0 0 0 722 806"/>
    <path d="M 656 744 L 714 744"/>
  </g>

  </g>

  <!-- icon -->
  <g transform="translate(749.7 -112.2) scale(1.08)">
  <!-- ============ CIRCUIT ============ -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 130 320 H 548"/>
    <path d="M 130 420 H 548"/>
    <path d="M 130 520 H 548"/>
  </g>

  <!-- qubit terminals -->
  <g fill="#9dc4ff">
    <circle cx="130" cy="320" r="14"/>
    <circle cx="130" cy="420" r="14"/>
    <circle cx="130" cy="520" r="14"/>
  </g>
  <g fill="#9dc4ff">
    <circle cx="548" cy="320" r="14"/>
    <circle cx="548" cy="420" r="14"/>
    <circle cx="548" cy="520" r="14"/>
  </g>

  <!-- gate boxes -->
  <g stroke="#ffffff" stroke-width="10" fill="#000000">
    <rect x="176" y="289" width="62" height="62" rx="14"/>
    <rect x="176" y="489" width="62" height="62" rx="14"/>
    <rect x="466" y="389" width="62" height="62" rx="14"/>
  </g>

  <!-- CNOT 1 : control on wire 1, target on wire 2 -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 306 320 V 420"/>
    <circle cx="306" cy="420" r="24"/>
    <path d="M 306 396 V 444"/>
    <path d="M 282 420 H 330"/>
  </g>
  <circle cx="306" cy="320" r="15" fill="#ffffff"/>

  <!-- CNOT 2 : control on wire 2, target on wire 3 -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 396 420 V 520"/>
    <circle cx="396" cy="520" r="24"/>
    <path d="M 396 496 V 544"/>
    <path d="M 372 520 H 420"/>
  </g>
  <circle cx="396" cy="420" r="15" fill="#ffffff"/>

  <!-- the cut -->
  <path d="M 351 258 V 582" stroke="#9dc4ff" stroke-width="10" stroke-linecap="round"
        stroke-dasharray="10 28" fill="none"/>

  <!-- ============ SCISSORS ============ -->
  <g transform="translate(762 400)">
    <!-- blades -->
    <path d="M -19 50 L 21 30 L 4 -248 Q 0 -258 -4 -246 Z"
          transform="rotate(-11)" fill="url(#blade)"/>
    <path d="M 19 50 L -21 30 L -4 -248 Q 0 -258 4 -246 Z"
          transform="rotate(11)" fill="url(#bladeB)"/>

    <!-- handles -->
    <path d="M 14 46 C 46 98 78 120 88 150" stroke="#ffffff" stroke-width="26"
          stroke-linecap="round" fill="none"/>
    <path d="M -14 46 C -46 98 -78 120 -88 150" stroke="#ffffff" stroke-width="26"
          stroke-linecap="round" fill="none"/>

    <!-- rings -->
    <circle cx="-90" cy="210" r="56" stroke="#ffffff" stroke-width="26" fill="none"/>
    <circle cx="90" cy="210" r="56" stroke="#9dc4ff" stroke-width="26" fill="none"/>

    <!-- pivot -->
    <circle cx="0" cy="12" r="13" fill="#000000" stroke="#9dc4ff" stroke-width="6"/>
  </g>

  
  </g>
</svg>
