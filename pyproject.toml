[build-system]
requires = [ "setuptools>=68.0.0", "setuptools_scm[toml]>=7" ]
build-backend = "setuptools.build_meta"

[project]
name = "QCut"
dynamic = [ "version" ]
authors = [
    { name = "Joonas Nivala", email = "joonas.nivala@gmail.com" },
]

description = "QCut is a quantum circuit knitting package built on top of qiskit for performing gate cuts and resetless wire cuts allowing simulation of larger quantum circuits on smaller quantum devices or simulators at the cost of a circuit overhead."
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Intended Audience :: Science/Research",
]

requires-python = ">=3.11, < 3.13"

dependencies = [
    "qiskit >= 1.1, < 3.0",
    "numpy",
    "qiskit-aer < 0.18",
    "pymetis==2025.2.2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.5",
    "notebook>=7.4.5",
    "pylatexenc>=2.10",
    "pytest>=8.4.1",
    "tox<=5.0.0",
    "tox-uv<=2.0.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.1",
    "ty >=0.0.15",
]
docs = [
    "sphinx==9.0.4",
    "myst-nb",
    "sphinx-book-theme",
    "sphinx_lesson",
]


[project.urls]
homepage = "https://github.com/JooNiv/QCut"
documentation = "https://jooniv.github.io/QCut/"
repository = "https://github.com/JooNiv/QCut.git"
changelog = "https://github.com/JooNiv/QCut/blob/main/CHANGELOG.rst"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff"]
# MPI task-farm execution (QCut.mpi_run / MPIExecutor). On LUMI prefer the
# Cray-provided mpi4py from `module load cray-python` (built against cray-mpich)
# over this PyPI wheel, which bundles a generic MPI and will silently run each
# rank as an independent size-1 job.
mpi = ["mpi4py>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
exclude=["tests", "tests.*"]


[tool.setuptools_scm]
version_scheme = "no-guess-dev"


[tool.ruff]
exclude = [
    "__pycache__",
    ".pytest_cache",
    ".vscode",
    "build",
    "dist",
    "docs",
    "htmlcov",
    "QCut.egg-info",
    ".coverage",
    "explain.txt",
    "tests/solutions_1q.py",
    "tests/solutions.py",
]
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # all errors
    "F",  # all pyflakes-related checks
    "I",  # import-related checks
    "C",  # all code style issues
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
python_files = ["tests.py", "test_*.py"]
